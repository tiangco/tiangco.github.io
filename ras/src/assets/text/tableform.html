<div style="font-family: 'PixieFont', 'Trebuchet MS'; color: blanchedalmond;">
  <div style="margin-bottom: 14px;">
    <input
      type="text"
      name="joinField"
      placeholder="building name"
      maxlength="20"
      style="font-size: 26px; width: 260px; font-family: 'PixieFont', 'Trebuchet MS'"
    />
    <input
      type="button"
      name="joinButton"
      value="Join by name"
      style="font-size: 26px; margin-left: 12px; font-family: 'PixieFont', 'Trebuchet MS'"
    />
  </div>

  <div>
    <input
      type="text"
      name="createField"
      placeholder="new building name"
      maxlength="20"
      style="font-size: 26px; width: 260px; font-family: 'PixieFont', 'Trebuchet MS'"
    />
    <select
      name="seatsField"
      style="font-size: 26px; font-family: 'PixieFont', 'Trebuchet MS'"
    >
      <option value="3">3 residents</option>
      <option value="4">4 residents</option>
      <option value="5" selected>5 residents</option>
    </select>
    <label style="font-size: 20px; margin-left: 10px;">
      <input type="checkbox" name="publicField" checked /> list it publicly
    </label>
    <input
      type="button"
      name="createButton"
      value="Open a building"
      style="font-size: 26px; margin-left: 12px; font-family: 'PixieFont', 'Trebuchet MS'"
    />
  </div>
</div>
